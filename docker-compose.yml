services:
  postgres:
    image: postgres:16
    container_name: SuperSafeTwin_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nullpo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-SuperSafeTwin_db}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: SuperSafeTwin_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_SERVER_URL: ${MINIO_PUBLIC_SCHEME:-https}://${MINIO_PUBLIC_DOMAIN:-supersafetwin-minio.duckdns.org}
    ports:
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    expose:
      - "9000"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: SuperSafeTwin_minio_init
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-scan-files}
    volumes:
      - ./infra/minio/cors.xml:/etc/minio/cors.xml:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e

        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done

        mc mb --ignore-existing "local/$${MINIO_BUCKET_NAME}"
        mc anonymous set none "local/$${MINIO_BUCKET_NAME}"
        mc cors set "local/$${MINIO_BUCKET_NAME}" /etc/minio/cors.xml

  caddy:
    image: caddy:2-alpine
    container_name: SuperSafeTwin_caddy
    restart: always
    depends_on:
      - minio
    environment:
      API_PUBLIC_DOMAIN: ${API_PUBLIC_DOMAIN:-supersafetwin-backend.duckdns.org}
      MINIO_PUBLIC_DOMAIN: ${MINIO_PUBLIC_DOMAIN:-supersafetwin-minio.duckdns.org}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env to your frontend origin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
